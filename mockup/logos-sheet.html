<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BSE Tools · logo set v2</title>
  <style>
    body {
      margin: 0; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Helvetica Neue", sans-serif;
      background: #D8DCE2; color: #1E2A50;
    }
    h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
    .sub { color: #5A6178; font-size: 12px; margin-bottom: 16px; font-weight: 500; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    .tile {
      background: #fff; border: 1px solid #C8CDD8; border-radius: 12px;
      padding: 14px; width: 200px;
    }
    .tile img { width: 64px; height: 64px; border-radius: 14px; display: block; }
    .tile img.sm { width: 40px; height: 40px; border-radius: 10px; margin-top: 10px; }
    .tile .name { font-weight: 700; margin-top: 10px; font-size: 15px; }
    .tile .zh { color: #5A6178; font-size: 12px; font-weight: 500; }
    .tile .note { color: #5A6178; font-size: 11px; margin-top: 8px; line-height: 1.35; }
  </style>
</head>
<body>
  <h1>BSE Tools — logo set (B1)</h1>
  <p class="sub">Same ink / accent as psychart · readable at 40px on cards</p>
  <div class="row">
    <div class="tile">
      <img src="../logos/bse-tools.svg" alt="BSE Tools" />
      <img class="sm" src="../logos/bse-tools.svg" alt="" />
      <div class="name">BSE Tools</div>
      <div class="zh">屋宇裝備工具</div>
      <p class="note">Hub — outline tiles (catalogue). Stroke language matches tool marks.</p>
    </div>
    <div class="tile">
      <img src="../logos/psychart.svg" alt="Psychart" />
      <img class="sm" src="../logos/psychart.svg" alt="" />
      <div class="name">Psychrometric Chart</div>
      <div class="zh">濕空氣線圖</div>
      <p class="note">Grid + humidity curve + OA/RA points.</p>
    </div>
    <div class="tile">
      <img src="../logos/p1-dp.svg" alt="P1" />
      <img class="sm" src="../logos/p1-dp.svg" alt="" />
      <div class="name">Duct / pipe ΔP</div>
      <div class="zh">風管／水管壓降</div>
      <p class="note">Pipe + flow + drop arrow (ΔP).</p>
    </div>
  </div>
</body>
</html>
