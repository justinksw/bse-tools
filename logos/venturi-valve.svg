  <!-- shaft -->
  <path d="M40 32 H50" fill="none" stroke="#8FA0C4" stroke-width="2" stroke-linecap="round"/>
  <!-- spring hint -->
  <path d="M42 28 Q43.5 32 42 36 Q44.5 32 42 28" fill="none" stroke="#C45C26" stroke-width="1.75" stroke-linecap="round"/>
  <!-- flow chevron -->
  <path d="M12 32 H18" fill="none" stroke="#8FA0C4" stroke-width="2" stroke-linecap="round"/>
  <path d="M15 28 L20 32 L15 36" fill="none" stroke="#8FA0C4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
